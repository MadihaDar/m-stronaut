<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="marsNightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a15"/>
      <stop offset="50%" stop-color="#1e1329"/>
      <stop offset="100%" stop-color="#4c1d24"/>
    </linearGradient>
    <linearGradient id="rocketPlume" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="20%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mavBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <radialGradient id="smokePlume" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c2d12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Dusk Martian Sky -->
  <rect width="600" height="340" fill="url(#marsNightSky)"/>
  <circle cx="70" cy="50" r="1.2" fill="#fff" opacity="0.8"/>
  <circle cx="160" cy="30" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="230" cy="70" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="380" cy="40" r="1.8" fill="#e0e7ff" opacity="0.9"/>
  <circle cx="520" cy="60" r="1.2" fill="#fff" opacity="0.7"/>

  <!-- Earth visible as a bright blue marble high in sky -->
  <circle cx="510" cy="45" r="7" fill="#38bdf8" opacity="0.9"/>
  <circle cx="510" cy="45" r="14" fill="#38bdf8" opacity="0.25"/>
  <text x="510" y="25" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">EARTH DESTINATION</text>

  <!-- Orbital Trajectory Arc to Earth -->
  <path d="M300,160 Q420,70 505,48" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" fill="none" opacity="0.85"/>

  <!-- Jezero Crater Plains & Distant Delta Rim -->
  <polygon points="0,210 120,185 240,205 380,180 500,200 600,190 600,240 0,240" fill="#2d1317"/>
  <polygon points="0,230 600,230 600,340 0,340" fill="#1b0c10"/>

  <!-- Launch Platform Foundation -->
  <rect x="230" y="250" width="140" height="30" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <rect x="210" y="275" width="180" height="15" rx="3" fill="#1e293b"/>

  <!-- Gantry Support Umbilical Tower -->
  <g transform="translate(370, 70)">
    <line x1="10" y1="0" x2="10" y2="190" stroke="#94a3b8" stroke-width="4"/>
    <line x1="30" y1="0" x2="30" y2="190" stroke="#94a3b8" stroke-width="4"/>
    <!-- Cross struts -->
    <line x1="10" y1="20" x2="30" y2="40" stroke="#64748b" stroke-width="2"/>
    <line x1="30" y1="40" x2="10" y2="60" stroke="#64748b" stroke-width="2"/>
    <line x1="10" y1="60" x2="30" y2="80" stroke="#64748b" stroke-width="2"/>
    <line x1="30" y1="80" x2="10" y2="100" stroke="#64748b" stroke-width="2"/>
    <line x1="10" y1="100" x2="30" y2="120" stroke="#64748b" stroke-width="2"/>
    <line x1="30" y1="120" x2="10" y2="140" stroke="#64748b" stroke-width="2"/>
    <line x1="10" y1="140" x2="30" y2="160" stroke="#64748b" stroke-width="2"/>
    <line x1="30" y1="160" x2="10" y2="180" stroke="#64748b" stroke-width="2"/>
    <!-- Retracted Umbilical Swing Arm -->
    <line x1="10" y1="50" x2="-45" y2="50" stroke="#ef4444" stroke-width="3"/>
    <line x1="10" y1="105" x2="-45" y2="105" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- MAV Exhaust Flame & Pre-Ignition Cloud -->
  <ellipse cx="300" cy="275" rx="90" ry="25" fill="url(#smokePlume)"/>
  <polygon points="280,248 300,310 320,248" fill="url(#rocketPlume)"/>

  <!-- Mars Ascent Vehicle (MAV) Rocket -->
  <g transform="translate(275, 45)">
    <!-- Stage 2 / Crew Capsule Nose Cone -->
    <polygon points="25,0 42,45 8,45" fill="url(#mavBody)" stroke="#f8fafc" stroke-width="1"/>
    <!-- Capsule Windows -->
    <ellipse cx="25" cy="30" rx="6" ry="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <!-- Stage 1 Fuel Body -->
    <rect x="8" y="45" width="34" height="150" fill="url(#mavBody)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Markings & Red Stripe -->
    <rect x="8" y="60" width="34" height="6" fill="#ef4444"/>
    <rect x="8" y="115" width="34" height="4" fill="#0284c7"/>
    <text x="25" y="95" fill="#0f172a" font-family="monospace" font-weight="900" font-size="8" text-anchor="middle" transform="rotate(90 25 95)">MAV-01</text>
    <!-- Aerodynamic Fins -->
    <polygon points="8,175 -8,205 8,195" fill="#475569"/>
    <polygon points="42,175 58,205 42,195" fill="#475569"/>
    <!-- Rocket Engine Bells -->
    <polygon points="12,195 18,205 6,205" fill="#1e293b"/>
    <polygon points="25,195 32,207 18,207" fill="#1e293b"/>
    <polygon points="38,195 44,205 32,205" fill="#1e293b"/>
  </g>

  <!-- Cargo Crane Loading Geological Samples -->
  <g transform="translate(140, 195)">
    <line x1="20" y1="75" x2="20" y2="10" stroke="#f59e0b" stroke-width="4"/>
    <line x1="20" y1="10" x2="75" y2="10" stroke="#f59e0b" stroke-width="3"/>
    <line x1="75" y1="10" x2="75" y2="40" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="68" y="40" width="14" height="12" rx="2" fill="#38bdf8" stroke="#fff" stroke-width="1"/>
    <text x="75" y="49" fill="#0f172a" font-family="monospace" font-size="6" text-anchor="middle">ROCK</text>
  </g>

  <!-- HUD Overlay Graphics -->
  <rect x="15" y="15" width="225" height="28" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#ef4444" stroke-width="1"/>
  <circle cx="28" cy="29" r="4" fill="#22c55e"/>
  <text x="38" y="33" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">MAV ASCENT • PRE-LAUNCH T-05m</text>

  <rect x="15" y="295" width="180" height="30" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1"/>
  <text x="105" y="314" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="11" text-anchor="middle">10-POINT CHECK: 10/10 READY</text>
</svg>
