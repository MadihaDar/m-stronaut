<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="60%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lunarGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="earthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#0369a1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iceGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="goldVisor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Sky & Stars -->
  <rect width="600" height="340" fill="url(#skyGrad1)"/>
  <circle cx="45" cy="35" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="110" cy="70" r="1.5" fill="#e2e8f0" opacity="0.9"/>
  <circle cx="180" cy="40" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="270" cy="85" r="1.2" fill="#fff" opacity="0.7"/>
  <circle cx="340" cy="30" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="430" cy="65" r="1" fill="#fff" opacity="0.9"/>
  <circle cx="530" cy="45" r="1.8" fill="#e2e8f0" opacity="0.9"/>
  <circle cx="580" cy="95" r="1" fill="#fff" opacity="0.7"/>

  <!-- Earth in Sky ("Earthrise") -->
  <circle cx="490" cy="80" r="32" fill="url(#earthGlow)"/>
  <circle cx="490" cy="80" r="24" fill="#0284c7"/>
  <path d="M476 74 Q484 66 496 70 Q504 74 502 84 Q492 88 480 84 Z" fill="#22c55e" opacity="0.85"/>
  <path d="M488 88 Q498 90 502 96 Q488 102 480 94 Z" fill="#22c55e" opacity="0.85"/>
  <path d="M472 80 Q485 75 498 78" stroke="#fff" stroke-width="2" fill="none" opacity="0.75"/>
  <path d="M480 86 Q495 84 506 88" stroke="#fff" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- Distant Shackleton Mountain Rim (Peak of Eternal Light) -->
  <polygon points="0,210 70,165 150,195 240,150 340,185 440,140 520,175 600,160 600,240 0,240" fill="#334155"/>
  <!-- Sunlight hit on ridge peaks -->
  <polygon points="50,178 70,165 100,185 85,190" fill="#cbd5e1" opacity="0.7"/>
  <polygon points="215,163 240,150 275,172 250,178" fill="#cbd5e1" opacity="0.7"/>
  <polygon points="415,152 440,140 470,160 450,166" fill="#f8fafc" opacity="0.8"/>

  <!-- Crater Floor & Foreground Terrain -->
  <path d="M0,230 Q140,215 300,235 T600,225 L600,340 L0,340 Z" fill="url(#lunarGround)"/>
  
  <!-- Deep Shadowed Crater (Permanently Shadowed Region - PSR) -->
  <ellipse cx="220" cy="285" rx="140" ry="35" fill="#020617"/>
  <path d="M120,285 Q220,310 320,285 Q220,295 120,285 Z" fill="url(#iceGlow)"/>
  <text x="220" y="293" fill="#67e8f9" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="1">LEND ICE ANOMALY DETECTED</text>

  <!-- Artemis Lunar Rover -->
  <g transform="translate(370, 215)">
    <!-- Wheels -->
    <ellipse cx="20" cy="55" rx="14" ry="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="20" cy="55" rx="6" ry="6" fill="#475569"/>
    <ellipse cx="85" cy="55" rx="14" ry="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="85" cy="55" rx="6" ry="6" fill="#475569"/>
    <!-- Chassis -->
    <rect x="15" y="32" width="75" height="15" rx="4" fill="#e2e8f0"/>
    <rect x="25" y="18" width="45" height="16" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="36" cy="26" r="3" fill="#38bdf8"/>
    <!-- Solar mast & High-Gain Antenna -->
    <line x1="75" y1="32" x2="75" y2="10" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="75" cy="8" rx="10" ry="4" fill="none" stroke="#e2e8f0" stroke-width="2" transform="rotate(-20 75 8)"/>
    <!-- Headlight Beam -->
    <polygon points="15,38 -40,65 -30,85 15,44" fill="#38bdf8" opacity="0.25"/>
  </g>

  <!-- Artemis Astronaut Standing Near Crater -->
  <g transform="translate(130, 200)">
    <!-- Boots -->
    <rect x="6" y="70" width="10" height="8" rx="3" fill="#334155"/>
    <rect x="20" y="70" width="10" height="8" rx="3" fill="#334155"/>
    <!-- Legs -->
    <line x1="11" y1="50" x2="11" y2="70" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <line x1="25" y1="50" x2="25" y2="70" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round"/>
    <!-- Torso & Life Support PLSS Pack -->
    <rect x="3" y="24" width="10" height="24" rx="3" fill="#64748b"/>
    <rect x="8" y="22" width="22" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Mission Patch -->
    <circle cx="14" cy="30" r="2.5" fill="#0284c7"/>
    <!-- Helmet & Gold Visor -->
    <circle cx="19" cy="14" r="11" fill="#f8fafc"/>
    <ellipse cx="22" cy="14" rx="7" ry="6" fill="url(#goldVisor)"/>
  </g>

  <!-- HUD Overlay Graphics -->
  <rect x="15" y="15" width="220" height="28" rx="6" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1"/>
  <circle cx="28" cy="29" r="4" fill="#22c55e"/>
  <text x="38" y="33" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">SHACKLETON CRATER RIM • 89.9° S</text>

  <rect x="440" y="295" width="145" height="30" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#67e8f9" stroke-width="1"/>
  <text x="512" y="314" fill="#67e8f9" font-family="monospace" font-weight="700" font-size="11" text-anchor="middle">LOLA ELEVATION: +1,240m</text>
</svg>
