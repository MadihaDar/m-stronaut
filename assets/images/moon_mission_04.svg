<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cryoSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010206"/>
      <stop offset="60%" stop-color="#060c1c"/>
      <stop offset="100%" stop-color="#0c1833"/>
    </linearGradient>
    <linearGradient id="iceGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="20%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="frostAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steamGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#a5f3fc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky & Frozen Stars -->
  <rect width="600" height="340" fill="url(#cryoSky)"/>
  <circle cx="50" cy="40" r="1.2" fill="#fff" opacity="0.9"/>
  <circle cx="120" cy="80" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="210" cy="30" r="1.1" fill="#fff" opacity="0.7"/>
  <circle cx="340" cy="65" r="1.4" fill="#a5f3fc" opacity="0.85"/>
  <circle cx="470" cy="40" r="1.8" fill="#fff" opacity="0.9"/>
  <circle cx="550" cy="75" r="1" fill="#fff" opacity="0.7"/>

  <!-- Jagged Shadowed Rim Peaks of Faustini -->
  <polygon points="0,170 80,120 170,150 260,110 370,145 490,95 560,135 600,115 600,220 0,220" fill="#1e293b"/>
  <polygon points="240,125 260,110 290,130 270,135" fill="#38bdf8" opacity="0.4"/>
  <polygon points="465,110 490,95 520,120 495,125" fill="#67e8f9" opacity="0.5"/>

  <!-- 40 K Permanently Shadowed Floor with Crystalline Ice Sheen -->
  <path d="M0,210 Q160,195 320,215 T600,205 L600,340 L0,340 Z" fill="url(#iceGround)"/>

  <!-- Glowing Cryogenic Permafrost Deposits -->
  <ellipse cx="330" cy="285" rx="190" ry="32" fill="url(#frostAura)"/>
  <ellipse cx="140" cy="270" rx="90" ry="20" fill="url(#frostAura)" opacity="0.7"/>

  <!-- Sparkling Ice Flakes -->
  <g fill="#e0f2fe" opacity="0.9">
    <polygon points="310,265 312,260 314,265 319,267 314,269 312,274 310,269 305,267"/>
    <polygon points="380,280 382,276 384,280 388,282 384,284 382,288 380,284 376,282"/>
    <polygon points="240,285 241,282 243,285 246,286 243,287 241,290 240,287 237,286"/>
    <polygon points="450,260 452,256 454,260 458,262 454,264 452,268 450,264 446,262"/>
  </g>

  <!-- Industrial Cryogenic Regolith Drill Platform -->
  <g transform="translate(300, 185)">
    <!-- Base Rig Foundation -->
    <rect x="-35" y="55" width="70" height="14" rx="3" fill="#334155"/>
    <rect x="-25" y="45" width="50" height="12" fill="#475569"/>
    <!-- Yellow NASA Safety Stripe -->
    <rect x="-35" y="65" width="70" height="4" fill="#eab308"/>
    <!-- Hydraulic Mast Towers -->
    <line x1="-16" y1="45" x2="-16" y2="-20" stroke="#94a3b8" stroke-width="4"/>
    <line x1="16" y1="45" x2="16" y2="-20" stroke="#94a3b8" stroke-width="4"/>
    <!-- Motor Housing -->
    <rect x="-24" y="-30" width="48" height="22" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Rotating Spiral Drill Auger -->
    <path d="M-6,-8 Q0,-4 6,-8 Q0,-12 -6,-8 M-6,8 Q0,12 6,8 Q0,4 -6,8 M-6,24 Q0,28 6,24 Q0,20 -6,24 M-6,40 Q0,44 6,40 Q0,36 -6,40 M-6,56 Q0,60 6,56" stroke="#f8fafc" stroke-width="4.5" fill="none"/>
    <polygon points="-8,72 8,72 0,84" fill="#38bdf8"/>
    <!-- Sublimation Heated Dome (Translucent Cyan) -->
    <path d="M-45,68 A 45,35 0 0,1 45,68 Z" fill="#38bdf8" opacity="0.3" stroke="#67e8f9" stroke-width="1.5"/>
    <!-- Sublimating Water Vapor Steam Plume -->
    <ellipse cx="0" cy="30" rx="22" ry="38" fill="url(#steamGrad)"/>
    <ellipse cx="12" cy="18" rx="16" ry="24" fill="url(#steamGrad)"/>
  </g>

  <!-- Blue Ice Crystal Shards -->
  <polygon points="170,280 185,250 195,285 180,290" fill="#38bdf8" opacity="0.85"/>
  <polygon points="182,283 185,250 190,282" fill="#e0f2fe" opacity="0.9"/>
  <polygon points="460,295 470,270 482,298 468,302" fill="#0284c7" opacity="0.8"/>

  <!-- Badge Overlay Tag -->
  <rect x="18" y="16" width="265" height="28" rx="14" fill="#0c1833" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
  <text x="32" y="34" font-family="'Orbitron', monospace, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" letter-spacing="1.5">🧊 FAUSTINI CRATER CRYO-MINE</text>
</svg>
