<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="marsSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="45%" stop-color="#7c2d12"/>
      <stop offset="80%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="marsDunes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="40%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <radialGradient id="greenhouseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="domeGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#14532d" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Martian Sky & Atmospheric Dust Haze -->
  <rect width="600" height="340" fill="url(#marsSky)"/>

  <!-- Phobos Moon -->
  <ellipse cx="480" cy="55" rx="14" ry="10" fill="#fed7aa" opacity="0.85" transform="rotate(-15 480 55)"/>
  <circle cx="476" cy="52" r="2.5" fill="#ca8a04" opacity="0.5"/>
  <circle cx="484" cy="57" r="2" fill="#ca8a04" opacity="0.5"/>

  <!-- Jezero Crater Rim / Ancient River Delta Cliffs -->
  <polygon points="0,170 70,140 160,165 240,130 330,155 420,125 510,145 600,135 600,220 0,220" fill="#7c2d12"/>
  <polygon points="120,155 160,165 240,130 200,145" fill="#9a3412" opacity="0.8"/>
  <polygon points="380,140 420,125 470,140 440,150" fill="#9a3412" opacity="0.8"/>

  <!-- Rolling Terraced Sand Dunes -->
  <path d="M0,200 Q150,180 300,205 T600,195 L600,340 L0,340 Z" fill="url(#marsDunes)"/>

  <!-- Geodesic Bio-Greenhouse (Glowing Green) -->
  <g transform="translate(190, 150)">
    <!-- Aura glow -->
    <ellipse cx="65" cy="50" rx="75" ry="50" fill="url(#greenhouseGlow)"/>
    <!-- Dome Base -->
    <ellipse cx="65" cy="65" rx="60" ry="12" fill="#1e293b"/>
    <!-- Geodesic Dome -->
    <path d="M5,65 A60,55 0 0,1 125,65 Z" fill="url(#domeGlass)" stroke="#86efac" stroke-width="2"/>
    <!-- Structural Truss Facets -->
    <line x1="65" y1="10" x2="25" y2="65" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="65" y1="10" x2="65" y2="65" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="65" y1="10" x2="105" y2="65" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <line x1="15" y1="40" x2="115" y2="40" stroke="#4ade80" stroke-width="1.5" opacity="0.7"/>
    <!-- Hydroponic Plants Silhouettes Inside -->
    <circle cx="45" cy="52" r="5" fill="#15803d"/>
    <circle cx="65" cy="48" r="6" fill="#166534"/>
    <circle cx="85" cy="52" r="5" fill="#15803d"/>
  </g>

  <!-- Habitat Living Quarters (Cylindrical Hub & Airlock) -->
  <g transform="translate(60, 185)">
    <rect x="0" y="10" width="85" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="15" y="18" width="18" height="12" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <!-- Airlock connector -->
    <rect x="85" y="20" width="30" height="20" rx="3" fill="#64748b"/>
    <!-- Status Light -->
    <circle cx="8" cy="18" r="2.5" fill="#22c55e"/>
  </g>

  <!-- Solar Array Farm -->
  <g transform="translate(350, 180)">
    <!-- Mast -->
    <line x1="25" y1="35" x2="25" y2="55" stroke="#cbd5e1" stroke-width="2.5"/>
    <!-- Panels tilted -->
    <polygon points="5,20 45,15 45,35 5,40" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <line x1="25" y1="17" x2="25" y2="38" stroke="#93c5fd" stroke-width="1"/>
    <line x1="5" y1="30" x2="45" y2="25" stroke="#93c5fd" stroke-width="1"/>

    <line x1="65" y1="38" x2="65" y2="58" stroke="#cbd5e1" stroke-width="2.5"/>
    <polygon points="45,23 85,18 85,38 45,43" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  </g>

  <!-- Exploration Rover Drilling for Subsurface Water Ice (SWIM) -->
  <g transform="translate(420, 220)">
    <ellipse cx="20" cy="55" rx="14" ry="12" fill="#1e293b" stroke="#78350f" stroke-width="2"/>
    <ellipse cx="90" cy="55" rx="14" ry="12" fill="#1e293b" stroke="#78350f" stroke-width="2"/>
    <rect x="15" y="30" width="80" height="18" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Robotic arm & Subsurface Drill -->
    <line x1="95" y1="35" x2="115" y2="48" stroke="#e2e8f0" stroke-width="3"/>
    <line x1="115" y1="48" x2="115" y2="78" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Ice Drill Sparks / Glint -->
    <circle cx="115" cy="78" r="4" fill="#67e8f9"/>
    <circle cx="115" cy="78" r="2" fill="#fff"/>
  </g>

  <!-- HUD Overlay Graphics -->
  <rect x="15" y="15" width="220" height="28" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#ea580c" stroke-width="1"/>
  <circle cx="28" cy="29" r="4" fill="#ea580c"/>
  <text x="38" y="33" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="700" font-size="11">JEZERO CRATER • 18.4°N, 77.5°E</text>

  <rect x="420" y="295" width="165" height="30" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#22c55e" stroke-width="1"/>
  <text x="502" y="314" fill="#4ade80" font-family="monospace" font-weight="700" font-size="11" text-anchor="middle">SWIM ICE RADAR: ACTIVE</text>
</svg>
