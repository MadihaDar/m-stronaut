<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="cosmicSky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02030a"/>
      <stop offset="45%" stop-color="#0a0a24"/>
      <stop offset="75%" stop-color="#1e103a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="farSideBasalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="milkyWayGlow" cx="60%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#1e1b4b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Far-Side Sky with Glowing Milky Way Band -->
  <rect width="600" height="340" fill="url(#cosmicSky)"/>
  <rect width="600" height="240" fill="url(#milkyWayGlow)"/>

  <!-- Ultra-Dense Milky Way Starfield (Zero Earth Light Pollution) -->
  <g fill="#ffffff">
    <circle cx="25" cy="20" r="0.8" opacity="0.8"/><circle cx="55" cy="45" r="1.4" opacity="0.9"/>
    <circle cx="85" cy="18" r="1.1" opacity="0.7"/><circle cx="120" cy="65" r="1.6" fill="#c084fc"/>
    <circle cx="160" cy="35" r="0.9" opacity="0.8"/><circle cx="195" cy="80" r="1.5" opacity="0.9"/>
    <circle cx="230" cy="25" r="1.2" opacity="0.75"/><circle cx="260" cy="55" r="1.8" fill="#38bdf8"/>
    <circle cx="310" cy="22" r="1.0" opacity="0.8"/><circle cx="345" cy="70" r="1.5" opacity="0.9"/>
    <circle cx="390" cy="40" r="1.3" opacity="0.75"/><circle cx="430" cy="15" r="2.0" fill="#fef08a"/>
    <circle cx="475" cy="60" r="1.1" opacity="0.85"/><circle cx="510" cy="30" r="1.7" opacity="0.9"/>
    <circle cx="550" cy="85" r="1.2" opacity="0.8"/><circle cx="580" cy="25" r="1.5" opacity="0.75"/>
    <circle cx="280" cy="110" r="1.2" opacity="0.6"/><circle cx="410" cy="95" r="1.4" opacity="0.7"/>
  </g>

  <!-- Distant Daedalus Crater Central Peak Massif -->
  <polygon points="0,175 60,140 140,165 220,120 300,150 400,105 480,145 550,125 600,150 600,230 0,230" fill="#1e293b"/>
  <!-- Highlights on Central Peak -->
  <polygon points="195,135 220,120 250,140 230,145" fill="#475569" opacity="0.6"/>
  <polygon points="375,120 400,105 435,130 410,135" fill="#64748b" opacity="0.65"/>

  <!-- Crater Floor (The Radio-Quiet Sanctuary) -->
  <path d="M0,215 Q150,195 300,220 T600,210 L600,340 L0,340 Z" fill="url(#farSideBasalt)"/>

  <!-- Low-Frequency Dipole Radio Antenna Array (3 Masts) -->
  <!-- Center Mast -->
  <g transform="translate(300, 170)">
    <!-- Base Tripod -->
    <polygon points="0,45 -18,65 18,65" fill="#475569"/>
    <line x1="0" y1="50" x2="0" y2="-35" stroke="#f8fafc" stroke-width="3"/>
    <!-- Horizontal Cross Dipole Arms -->
    <line x1="-45" y1="-25" x2="45" y2="-25" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="-45" cy="-25" r="3" fill="#00e5ff"/>
    <circle cx="45" cy="-25" r="3" fill="#00e5ff"/>
    <line x1="-30" y1="-15" x2="30" y2="-15" stroke="#38bdf8" stroke-width="2"/>
    <!-- Glowing Antenna Tip Transmitter -->
    <circle cx="0" cy="-35" r="4" fill="#a855f7"/>
    <!-- Expanding Radio Wave Pulsing Rings (21cm Cosmic Wave) -->
    <ellipse cx="0" cy="-35" rx="30" ry="14" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="0" cy="-35" rx="55" ry="25" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <ellipse cx="0" cy="-35" rx="85" ry="38" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Left Mast -->
  <g transform="translate(130, 205)">
    <polygon points="0,40 -14,56 14,56" fill="#334155"/>
    <line x1="0" y1="44" x2="0" y2="-20" stroke="#cbd5e1" stroke-width="2.5"/>
    <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-20" r="3" fill="#a855f7"/>
    <ellipse cx="0" cy="-20" rx="22" ry="10" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Right Mast -->
  <g transform="translate(480, 195)">
    <polygon points="0,40 -14,56 14,56" fill="#334155"/>
    <line x1="0" y1="44" x2="0" y2="-20" stroke="#cbd5e1" stroke-width="2.5"/>
    <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-20" r="3" fill="#a855f7"/>
    <ellipse cx="0" cy="-20" rx="22" ry="10" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Ground Optical Mesh Data Cables Linking Array -->
  <path d="M130,250 Q215,265 300,225 T480,240" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.8" stroke-dasharray="6,3"/>

  <!-- Badge Overlay Tag -->
  <rect x="18" y="16" width="280" height="28" rx="14" fill="#090d16" stroke="#a855f7" stroke-width="1.5" opacity="0.9"/>
  <text x="32" y="34" font-family="'Orbitron', monospace, sans-serif" font-size="11" font-weight="800" fill="#c084fc" letter-spacing="1.5">📡 DAEDALUS RADIO OBSERVATORY</text>
</svg>
