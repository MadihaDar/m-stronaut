<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="70%" stop-color="#070c18"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="caveRock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3242"/>
      <stop offset="50%" stop-color="#141a24"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <radialGradient id="sunShaft" cx="45%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="laserTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0077ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Sky & Stars -->
  <rect width="600" height="340" fill="url(#skyGrad3)"/>
  <circle cx="60" cy="30" r="1.2" fill="#fff" opacity="0.9"/>
  <circle cx="150" cy="55" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="280" cy="35" r="1.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="490" cy="45" r="1.3" fill="#fff" opacity="0.8"/>
  <circle cx="560" cy="70" r="1" fill="#fff" opacity="0.7"/>

  <!-- Surface Hills Rim -->
  <polygon points="0,120 120,95 240,115 380,85 480,110 600,100 600,160 0,160" fill="#1e293b"/>
  
  <!-- Massive Pit Opening (Marius Hills 65m Skylight) -->
  <ellipse cx="320" cy="155" rx="140" ry="28" fill="#030712"/>
  
  <!-- Volumetric Sunbeam Piercing the Pit Shaft -->
  <polygon points="270,145 370,145 460,340 180,340" fill="url(#sunShaft)"/>

  <!-- Subterranean Lava Tube Arched Vault -->
  <path d="M0,150 Q180,140 300,165 T600,155 L600,340 L0,340 Z" fill="url(#caveRock)"/>
  <!-- Cave Ceiling Arch -->
  <path d="M0,170 Q150,195 300,180 T600,190 L600,155 L0,155 Z" fill="#0f172a" opacity="0.95"/>
  <path d="M-10,210 Q140,240 280,215 T610,225" stroke="#334155" stroke-width="6" fill="none" opacity="0.6"/>

  <!-- Glowing Titanium-Ilmenite Mineral Veins -->
  <path d="M40,230 Q90,215 140,240 T220,225" stroke="#00e5ff" stroke-width="2.5" fill="none" opacity="0.85"/>
  <path d="M420,245 Q470,230 520,250 T580,235" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.75"/>

  <!-- Surface Winch & Umbilical Power Cable -->
  <rect x="235" y="140" width="16" height="22" rx="3" fill="#64748b"/>
  <path d="M243,155 C 243,230 200,280 230,290" stroke="#ffaa00" stroke-width="2.5" fill="none" stroke-dasharray="4,2"/>

  <!-- Lunar Rover in Cavern with LiDAR Fan Beam -->
  <g transform="translate(210, 275)">
    <!-- Rover Body -->
    <rect x="0" y="5" width="45" height="16" rx="4" fill="#f8fafc"/>
    <rect x="5" y="0" width="22" height="7" rx="2" fill="#0284c7"/>
    <!-- Wheels -->
    <circle cx="8" cy="22" r="7" fill="#334155"/>
    <circle cx="8" cy="22" r="4" fill="#94a3b8"/>
    <circle cx="37" cy="22" r="7" fill="#334155"/>
    <circle cx="37" cy="22" r="4" fill="#94a3b8"/>
    <!-- Dual Headlights Beam -->
    <polygon points="45,10 140,-15 150,45 45,16" fill="url(#laserTeal)" opacity="0.55"/>
    <!-- LiDAR Scanner Mast -->
    <line x1="28" y1="0" x2="28" y2="-8" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="28" cy="-8" r="3" fill="#00ffcc"/>
  </g>

  <!-- Holographic Point Cloud Grid Dots (LiDAR) -->
  <g fill="#00ffcc" opacity="0.85">
    <circle cx="380" cy="270" r="1.5"/><circle cx="395" cy="265" r="1.5"/><circle cx="410" cy="272" r="1.5"/>
    <circle cx="390" cy="285" r="1.5"/><circle cx="420" cy="280" r="1.5"/><circle cx="440" cy="268" r="1.5"/>
    <circle cx="410" cy="300" r="1.5"/><circle cx="435" cy="295" r="1.5"/><circle cx="460" cy="285" r="1.5"/>
  </g>

  <!-- Badge Overlay Tag -->
  <rect x="18" y="16" width="250" height="28" rx="14" fill="#0f172a" stroke="#00e5ff" stroke-width="1.5" opacity="0.9"/>
  <text x="32" y="34" font-family="'Orbitron', monospace, sans-serif" font-size="11" font-weight="800" fill="#00e5ff" letter-spacing="1.5">🕳️ MARIUS HILLS LAVA TUBE</text>
</svg>
